<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ app_name }}</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="sidebar">
<div class="brand">{{ app_name }}</div>
<a class="nav-item {{ 'active' if active=='dashboard' else '' }}" href="/">Dashboard</a>
<a class="nav-item {{ 'active' if active=='register' else '' }}" href="/ui/register">Register Criminal</a>
<a class="nav-item {{ 'active' if active=='search' else '' }}" href="/ui/search">Identify / Search</a>
<a class="nav-item {{ 'active' if active=='models' else '' }}" href="/ui/models">Models</a>
<a class="nav-item {{ 'active' if active=='settings' else '' }}" href="/ui/settings">Settings</a>
</div>
<div class="main">
{% block content %}{% endblock %}
</div>
<script src="/static/js/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
